[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duewright"
version = "1.0.0"
description = "A task manager with a menu, a REST API and a database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.146", "uvicorn>=0.54"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "httpx>=0.28"]

[project.scripts]
duewright = "duewright.cli:main"

[tool.setuptools.packages.find]
include = ["duewright*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["duewright"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
# Measure the code the tests start as processes too. Without this the menu
# looks untested, because its tests drive it in another process.
patch = ["subprocess"]
parallel = true
