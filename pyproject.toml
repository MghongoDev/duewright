[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duewright"
version = "0.2.0"
description = "A command-line task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "httpx"]

[project.scripts]
duewright = "duewright.cli:main"

[tool.setuptools.packages.find]
include = ["duewright*"]
